<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow -->
  <circle cx="300" cy="200" r="150" fill="#9333EA" opacity="0.05" />
  <circle cx="300" cy="200" r="100" fill="#9333EA" opacity="0.1" />
  
  <!-- Brain outline -->
  <path d="M320 100 C380 100, 400 140, 400 170 C400 200, 380 220, 380 240 C380 260, 390 280, 370 290 C350 300, 330 290, 310 290 L290 290 C270 290, 250 300, 230 290 C210 280, 220 260, 220 240 C220 220, 200 200, 200 170 C200 140, 220 100, 280 100 L320 100 Z" 
    stroke="#9333EA" 
    stroke-width="4"
    fill="none" />
  
  <!-- Circuit nodes and connections -->
  <!-- Left side nodes -->
  <circle cx="220" cy="140" r="8" fill="#9333EA" />
  <circle cx="240" cy="190" r="8" fill="#A855F7" />
  <circle cx="230" cy="240" r="8" fill="#9333EA" />
  
  <!-- Right side nodes -->
  <circle cx="380" cy="140" r="8" fill="#A855F7" />
  <circle cx="360" cy="190" r="8" fill="#9333EA" />
  <circle cx="370" cy="240" r="8" fill="#A855F7" />
  
  <!-- Central nodes -->
  <circle cx="300" cy="130" r="10" fill="#9333EA" />
  <circle cx="280" cy="180" r="10" fill="#A855F7" />
  <circle cx="320" cy="180" r="10" fill="#9333EA" />
  <circle cx="300" cy="230" r="10" fill="#A855F7" />
  <circle cx="300" cy="270" r="12" fill="#9333EA" />
  
  <!-- Connecting lines -->
  <line x1="220" y1="140" x2="300" y2="130" stroke="#9333EA" stroke-width="2" />
  <line x1="380" y1="140" x2="300" y2="130" stroke="#9333EA" stroke-width="2" />
  <line x1="300" y1="130" x2="280" y2="180" stroke="#9333EA" stroke-width="2" />
  <line x1="300" y1="130" x2="320" y2="180" stroke="#9333EA" stroke-width="2" />
  <line x1="240" y1="190" x2="280" y2="180" stroke="#9333EA" stroke-width="2" />
  <line x1="360" y1="190" x2="320" y2="180" stroke="#9333EA" stroke-width="2" />
  <line x1="280" y1="180" x2="300" y2="230" stroke="#9333EA" stroke-width="2" />
  <line x1="320" y1="180" x2="300" y2="230" stroke="#9333EA" stroke-width="2" />
  <line x1="230" y1="240" x2="300" y2="230" stroke="#9333EA" stroke-width="2" />
  <line x1="370" y1="240" x2="300" y2="230" stroke="#9333EA" stroke-width="2" />
  <line x1="300" y1="230" x2="300" y2="270" stroke="#9333EA" stroke-width="2" />
  
  <!-- Pulses moving through the circuits (animated circles) -->
  <circle cx="260" cy="135" r="3" fill="#C084FC">
    <animate attributeName="cx" from="220" to="300" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" from="140" to="130" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="340" cy="135" r="3" fill="#C084FC">
    <animate attributeName="cx" from="380" to="300" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="cy" from="140" to="130" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="290" cy="155" r="3" fill="#C084FC">
    <animate attributeName="cx" from="300" to="280" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="cy" from="130" to="180" dur="1.5s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="310" cy="155" r="3" fill="#C084FC">
    <animate attributeName="cx" from="300" to="320" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" from="130" to="180" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="290" cy="205" r="3" fill="#C084FC">
    <animate attributeName="cx" from="280" to="300" dur="1.7s" repeatCount="indefinite" />
    <animate attributeName="cy" from="180" to="230" dur="1.7s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="310" cy="205" r="3" fill="#C084FC">
    <animate attributeName="cx" from="320" to="300" dur="1.9s" repeatCount="indefinite" />
    <animate attributeName="cy" from="180" to="230" dur="1.9s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="300" cy="250" r="3" fill="#C084FC">
    <animate attributeName="cy" from="230" to="270" dur="1.3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Glowing effects -->
  <circle cx="300" cy="130" r="15" fill="#9333EA" opacity="0.2" />
  <circle cx="300" cy="270" r="18" fill="#9333EA" opacity="0.2" />
  
  <!-- Text -->
  <text x="290" y="320" font-family="Arial" font-size="18" font-weight="bold" fill="#9333EA" text-anchor="middle">PULP</text>
  <text x="290" y="340" font-family="Arial" font-size="12" fill="#A855F7" text-anchor="middle">Persuasive Intelligence</text>
</svg> 