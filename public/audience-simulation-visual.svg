<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Central message node -->
  <circle cx="250" cy="200" r="40" fill="#111111" stroke="#FF66C4" stroke-width="2" />
  <circle cx="250" cy="200" r="60" fill="none" stroke="#FF66C4" stroke-width="1" stroke-opacity="0.3" />
  <circle cx="250" cy="200" r="80" fill="none" stroke="#FF66C4" stroke-width="1" stroke-opacity="0.2" />
  <text x="250" y="200" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14" font-family="sans-serif">AUDIENCE</text>
  <text x="250" y="220" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="10" font-family="sans-serif">SIMULATION</text>
  
  <!-- Audience segments -->
  <g>
    <!-- Segment A -->
    <circle cx="130" cy="120" r="30" fill="#111111" stroke="#FF66C4" stroke-width="1.5" />
    <text x="130" y="115" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif" font-weight="bold">SEGMENT A</text>
    <text x="130" y="130" text-anchor="middle" fill="#FF66C4" font-size="8" font-family="sans-serif">75% POSITIVE</text>
    <line x1="250" y1="200" x2="160" y2="140" stroke="#FF66C4" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3" />
    
    <!-- Segment B -->
    <circle cx="370" cy="120" r="30" fill="#111111" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="370" y="115" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif" font-weight="bold">SEGMENT B</text>
    <text x="370" y="130" text-anchor="middle" fill="#8B5CF6" font-size="8" font-family="sans-serif">64% POSITIVE</text>
    <line x1="250" y1="200" x2="340" y2="140" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3" />
    
    <!-- Segment C -->
    <circle cx="130" cy="280" r="30" fill="#111111" stroke="#3B82F6" stroke-width="1.5" />
    <text x="130" y="275" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif" font-weight="bold">SEGMENT C</text>
    <text x="130" y="290" text-anchor="middle" fill="#3B82F6" font-size="8" font-family="sans-serif">82% POSITIVE</text>
    <line x1="250" y1="200" x2="160" y2="260" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3" />
    
    <!-- Segment D -->
    <circle cx="370" cy="280" r="30" fill="#111111" stroke="#10B981" stroke-width="1.5" />
    <text x="370" y="275" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif" font-weight="bold">SEGMENT D</text>
    <text x="370" y="290" text-anchor="middle" fill="#10B981" font-size="8" font-family="sans-serif">91% POSITIVE</text>
    <line x1="250" y1="200" x2="340" y2="260" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3" />
  </g>
  
  <!-- Analysis points -->
  <g filter="url(#glow)">
    <circle cx="250" cy="100" r="15" fill="#111111" stroke="#FF66C4" stroke-width="1" />
    <text x="250" y="103" text-anchor="middle" fill="white" font-size="7" font-family="sans-serif">SENTIMENT</text>
    <line x1="250" y1="115" x2="250" y2="160" stroke="#FF66C4" stroke-width="1" stroke-dasharray="3,2" />
    
    <circle cx="160" cy="200" r="15" fill="#111111" stroke="#FF66C4" stroke-width="1" />
    <text x="160" y="203" text-anchor="middle" fill="white" font-size="7" font-family="sans-serif">INTENT</text>
    <line x1="175" y1="200" x2="210" y2="200" stroke="#FF66C4" stroke-width="1" stroke-dasharray="3,2" />
    
    <circle cx="340" cy="200" r="15" fill="#111111" stroke="#FF66C4" stroke-width="1" />
    <text x="340" y="203" text-anchor="middle" fill="white" font-size="7" font-family="sans-serif">REACTION</text>
    <line x1="325" y1="200" x2="290" y2="200" stroke="#FF66C4" stroke-width="1" stroke-dasharray="3,2" />
    
    <circle cx="250" cy="300" r="15" fill="#111111" stroke="#FF66C4" stroke-width="1" />
    <text x="250" y="303" text-anchor="middle" fill="white" font-size="7" font-family="sans-serif">INFLUENCE</text>
    <line x1="250" y1="285" x2="250" y2="240" stroke="#FF66C4" stroke-width="1" stroke-dasharray="3,2" />
  </g>
  
  <!-- Data analysis points -->
  <g>
    <circle cx="200" cy="150" r="3" fill="#FF66C4" />
    <circle cx="235" cy="165" r="3" fill="#FF66C4" />
    <circle cx="265" cy="165" r="3" fill="#FF66C4" />
    <circle cx="300" cy="150" r="3" fill="#FF66C4" />
    <circle cx="200" cy="250" r="3" fill="#FF66C4" />
    <circle cx="235" cy="235" r="3" fill="#FF66C4" />
    <circle cx="265" cy="235" r="3" fill="#FF66C4" />
    <circle cx="300" cy="250" r="3" fill="#FF66C4" />
  </g>
  
  <!-- Confidence ring -->
  <circle cx="250" cy="200" r="100" fill="none" stroke="#FF66C4" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10,5" />
  
  <!-- Certainty markers -->
  <g>
    <circle cx="150" cy="200" r="4" fill="#FF66C4" fill-opacity="0.4" />
    <circle cx="350" cy="200" r="4" fill="#FF66C4" fill-opacity="0.4" />
    <circle cx="250" cy="100" r="4" fill="#FF66C4" fill-opacity="0.4" />
    <circle cx="250" cy="300" r="4" fill="#FF66C4" fill-opacity="0.4" />
    
    <circle cx="179" cy="129" r="4" fill="#FF66C4" fill-opacity="0.4" />
    <circle cx="321" cy="129" r="4" fill="#FF66C4" fill-opacity="0.4" />
    <circle cx="179" cy="271" r="4" fill="#FF66C4" fill-opacity="0.4" />
    <circle cx="321" cy="271" r="4" fill="#FF66C4" fill-opacity="0.4" />
  </g>
  
  <!-- The label "CERTAINTY" with accent -->
  <g transform="translate(410, 30)">
    <rect x="-5" y="-15" width="65" height="20" rx="10" fill="#111111" stroke="#FF66C4" stroke-width="1" />
    <text x="27" y="0" text-anchor="middle" fill="#FF66C4" font-size="10" font-family="sans-serif" font-weight="bold">CERTAINTY</text>
  </g>
</svg> 