<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>
    
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.7"/>
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#darkGradient)"/>
  <rect width="600" height="400" fill="url(#gridPattern)"/>
  
  <!-- Central Hub - Education AI Platform -->
  <circle cx="300" cy="200" r="70" fill="url(#glowGradient)" opacity="0.5"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="300" cy="200" r="50" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- School/Campus Building -->
  <path d="M120,280 L120,220 L170,220 L170,250 L200,250 L200,220 L240,220 L240,280 Z" 
        fill="#1F2937" stroke="#10B981" stroke-width="1"/>
  <path d="M150,200 L210,200 L180,180 Z" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
  <rect x="150" y="250" width="15" height="30" fill="none" stroke="#10B981" stroke-width="1"/>
  <rect x="190" y="230" width="10" height="10" fill="none" stroke="#10B981" stroke-width="1"/>
  <rect x="130" y="230" width="10" height="10" fill="none" stroke="#10B981" stroke-width="1"/>
  <rect x="220" y="230" width="10" height="10" fill="none" stroke="#10B981" stroke-width="1"/>
  
  <!-- Digital Library/Research Center -->
  <rect x="400" y="200" width="80" height="70" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
  <path d="M400,200 L440,180 L480,200" fill="none" stroke="#10B981" stroke-width="1"/>
  <line x1="415" y1="200" x2="415" y2="270" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
  <line x1="430" y1="200" x2="430" y2="270" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
  <line x1="445" y1="200" x2="445" y2="270" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
  <line x1="460" y1="200" x2="460" y2="270" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
  <line x1="475" y1="200" x2="475" y2="270" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
  
  <!-- Students & Educators Nodes -->
  <g opacity="0.8">
    <!-- Student/Teacher Nodes -->
    <circle cx="120" cy="150" r="10" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="180" cy="100" r="12" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="450" cy="130" r="8" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="500" cy="170" r="14" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="140" cy="330" r="11" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="400" cy="320" r="9" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="480" cy="300" r="13" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    
    <!-- Connection Lines -->
    <path d="M300,200 L120,150" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M300,200 L180,100" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M300,200 L450,130" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M300,200 L500,170" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M300,200 L140,330" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M300,200 L400,320" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M300,200 L480,300" stroke="#10B981" stroke-width="1" stroke-dasharray="5,3"/>
    
    <!-- Pulse Animations on Lines (represented as dots) -->
    <circle cx="210" cy="175" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="150" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="375" cy="165" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="185" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="265" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="260" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="250" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Brain/Learning Visualization in Center -->
  <g transform="translate(300, 200)">
    <!-- Central Brain Element -->
    <path d="M0,-30 C-20,-30 -30,-15 -30,0 C-30,15 -20,30 0,30 C20,30 30,15 30,0 C30,-15 20,-30 0,-30 Z" 
         fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"
         transform="rotate(45)">
    </path>
    
    <!-- Neural Connections -->
    <path d="M-25,-10 L-12,-5 M-12,-5 L-18,8 M-12,-5 L-2,2 M-2,2 L-5,15 M-2,2 L8,8 M8,8 L2,18 M8,8 L20,5 M20,5 L15,15 M20,5 L25,-5"
          stroke="#10B981" stroke-width="1" stroke-opacity="0.7" fill="none"/>
    
    <!-- Animated Thinking Nodes -->
    <circle cx="-18" cy="8" r="2" fill="#10B981">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-5" cy="15" r="2" fill="#10B981">
      <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="2" cy="18" r="2" fill="#10B981">
      <animate attributeName="r" values="2;3;2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="15" r="2" fill="#10B981">
      <animate attributeName="r" values="2;3;2" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Research Analytics Element -->
  <g transform="translate(240, 120)">
    <!-- Research Paper Icon -->
    <rect x="0" y="0" width="25" height="35" rx="2" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="8" x2="20" y2="8" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="13" x2="18" y2="13" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="18" x2="15" y2="18" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="23" x2="20" y2="23" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="28" x2="17" y2="28" stroke="#10B981" stroke-width="1"/>
  </g>
  
  <g transform="translate(350, 120)">
    <!-- Research Analytics -->
    <rect x="0" y="0" width="30" height="35" rx="2" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <polyline points="5,28 10,20 15,24 20,15 25,12" 
             fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Adaptive Learning Elements -->
  <g transform="translate(220, 250)">
    <!-- Learning Dashboard -->
    <rect x="0" y="0" width="30" height="25" rx="2" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="6" x2="25" y2="6" stroke="#10B981" stroke-width="1"/>
    <rect x="5" y1="10" width="20" height="4" rx="1" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="0.5"/>
    <rect x="5" y1="16" width="15" height="4" rx="1" fill="#10B981" fill-opacity="0.5" stroke="#10B981" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(360, 250)">
    <!-- Learning Path -->
    <path d="M0,20 C5,15 10,25 15,18 C20,10 25,20 30,15" 
         fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="2" fill="#10B981"/>
    <circle cx="15" cy="18" r="2" fill="#10B981"/>
    <circle cx="30" cy="15" r="2" fill="#10B981"/>
  </g>
  
  <!-- Curriculum Generation Element -->
  <g transform="translate(230, 330)">
    <!-- Curriculum Document -->
    <path d="M0,0 L25,0 L25,30 L0,30 Z" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="7" x2="20" y2="7" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="12" x2="20" y2="12" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="17" x2="15" y2="17" stroke="#10B981" stroke-width="1"/>
    <line x1="5" y1="22" x2="18" y2="22" stroke="#10B981" stroke-width="1"/>
  </g>
  
  <g transform="translate(350, 330)">
    <!-- AI Helping with Curriculum -->
    <circle cx="0" cy="0" r="10" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="12" fill="#10B981" font-family="monospace">AI</text>
    <path d="M12,0 L20,0" stroke="#10B981" stroke-width="1" stroke-dasharray="2,1">
      <animate attributeName="stroke-dashoffset" values="0;-6" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Analytics Dashboard -->
  <g transform="translate(300, 150)">
    <rect x="-35" y="-15" width="70" height="40" rx="3" fill="#1F2937" stroke="#10B981" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="-25" y1="-7" x2="25" y2="-7" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.7"/>
    
    <!-- Chart Elements -->
    <rect x="-25" y="0" width="8" height="15" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="0.5"/>
    <rect x="-15" y="5" width="8" height="10" fill="#10B981" fill-opacity="0.4" stroke="#10B981" stroke-width="0.5"/>
    <rect x="-5" y="-5" width="8" height="20" fill="#10B981" fill-opacity="0.5" stroke="#10B981" stroke-width="0.5"/>
    <rect x="5" y="8" width="8" height="7" fill="#10B981" fill-opacity="0.4" stroke="#10B981" stroke-width="0.5"/>
    <rect x="15" y="-3" width="8" height="18" fill="#10B981" fill-opacity="0.6" stroke="#10B981" stroke-width="0.5"/>
  </g>
  
  <!-- Pulse Circle Animation -->
  <circle cx="300" cy="200" r="85" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="70;90;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Student Progress Tracking -->
  <g transform="translate(300, 290)">
    <path d="M-40,-10 Q-20,10 0,-5 Q20,15 40,0" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="-40" cy="-10" r="3" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="-20" cy="10" r="3" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="0" cy="-5" r="3" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="20" cy="15" r="3" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <circle cx="40" cy="0" r="3" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
  </g>
  
  <!-- Small Decorative Elements -->
  <circle cx="150" cy="200" r="2" fill="#10B981"/>
  <circle cx="170" cy="210" r="2" fill="#10B981"/>
  <circle cx="450" cy="210" r="2" fill="#10B981"/>
  <circle cx="430" cy="220" r="2" fill="#10B981"/>
  <circle cx="300" cy="100" r="2" fill="#10B981"/>
  <circle cx="310" cy="320" r="2" fill="#10B981"/>
  <circle cx="290" cy="310" r="2" fill="#10B981"/>
</svg> 