<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.6"/>
    </linearGradient>
    
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0.5"/>
    </linearGradient>
    
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.7"/>
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#9333EA" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#darkGradient)"/>
  <rect width="600" height="400" fill="url(#gridPattern)"/>
  
  <!-- Central Hub - Marketing AI Platform -->
  <circle cx="300" cy="200" r="70" fill="url(#glowGradient)" opacity="0.5"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#9333EA" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="300" cy="200" r="50" fill="none" stroke="#9333EA" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Marketing Dashboard -->
  <rect x="120" y="220" width="120" height="80" rx="4" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
  <rect x="130" y="230" width="100" height="15" rx="2" fill="#111827" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="130" y="252" width="40" height="40" rx="2" fill="#111827" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="177" y="252" width="45" height="40" rx="2" fill="#111827" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.5"/>
  
  <!-- Graph in Dashboard -->
  <polyline points="135,282 145,275 155,280 165,267 175,272" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Bar Chart in Dashboard -->
  <rect x="180" y="282" width="6" height="6" fill="#9333EA"/>
  <rect x="190" y="278" width="6" height="10" fill="#9333EA"/>
  <rect x="200" y="272" width="6" height="16" fill="#9333EA"/>
  <rect x="210" y="265" width="6" height="23" fill="#9333EA"/>
  
  <!-- Audience Segments -->
  <g transform="translate(440, 240)">
    <circle cx="0" cy="0" r="40" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    
    <!-- Segments -->
    <path d="M 0 0 L 40 0 A 40 40 0 0 0 20 -34.64 Z" fill="#9333EA" fill-opacity="0.7"/>
    <path d="M 0 0 L 20 -34.64 A 40 40 0 0 0 -20 -34.64 Z" fill="#EC4899" fill-opacity="0.7"/>
    <path d="M 0 0 L -20 -34.64 A 40 40 0 0 0 -40 0 Z" fill="#9333EA" fill-opacity="0.5"/>
    <path d="M 0 0 L -40 0 A 40 40 0 0 0 -20 34.64 Z" fill="#9333EA" fill-opacity="0.3"/>
    <path d="M 0 0 L -20 34.64 A 40 40 0 0 0 20 34.64 Z" fill="#9333EA" fill-opacity="0.6"/>
    <path d="M 0 0 L 20 34.64 A 40 40 0 0 0 40 0 Z" fill="#EC4899" fill-opacity="0.5"/>
    
    <!-- Center Point -->
    <circle cx="0" cy="0" r="5" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
  </g>
  
  <!-- Content Optimization -->
  <g transform="translate(170, 130)">
    <!-- Content Frame -->
    <rect x="-40" y="-25" width="80" height="50" rx="3" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    
    <!-- Text Lines -->
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="-5" x2="25" y2="-5" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="5" x2="20" y2="5" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="15" x2="30" y2="15" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.7"/>
    
    <!-- Optimization Indicators -->
    <circle cx="35" cy="-15" r="3" fill="#EC4899">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="15" r="3" fill="#EC4899">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Campaign Performance Tracking -->
  <g transform="translate(440, 130)">
    <!-- Frame -->
    <rect x="-35" y="-25" width="70" height="50" rx="3" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    
    <!-- Performance Chart -->
    <polyline points="-25,-10 -15,0 -5,-15 5,-5 15,-20 25,-5" fill="none" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="-25" cy="-10" r="2" fill="#9333EA"/>
    <circle cx="-15" cy="0" r="2" fill="#9333EA"/>
    <circle cx="-5" cy="-15" r="2" fill="#9333EA"/>
    <circle cx="5" cy="-5" r="2" fill="#9333EA"/>
    <circle cx="15" cy="-20" r="2" fill="#9333EA"/>
    <circle cx="25" cy="-5" r="2" fill="#9333EA"/>
    
    <!-- Target Indicator -->
    <circle cx="15" cy="-20" r="5" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.7">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- User Profiles -->
  <g transform="translate(180, 330)">
    <!-- Profile Circles -->
    <circle cx="-40" cy="0" r="15" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    <circle cx="0" cy="0" r="15" fill="#1F2937" stroke="#EC4899" stroke-width="1"/>
    <circle cx="40" cy="0" r="15" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    
    <!-- Connection Lines -->
    <line x1="-25" y1="0" x2="-15" y2="0" stroke="#9333EA" stroke-width="1" stroke-dasharray="2,1"/>
    <line x1="15" y1="0" x2="25" y2="0" stroke="#9333EA" stroke-width="1" stroke-dasharray="2,1"/>
    
    <!-- Data Points -->
    <circle cx="-20" cy="0" r="2" fill="#9333EA">
      <animate attributeName="cx" values="-25;-15;-25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="0" r="2" fill="#9333EA">
      <animate attributeName="cx" values="15;25;15" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Social Media Nodes -->
  <g transform="translate(420, 330)">
    <!-- Social Platform Icons -->
    <circle cx="-30" cy="0" r="10" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    <text x="-30" y="3" text-anchor="middle" font-size="10" fill="#9333EA" font-family="Arial">S</text>
    
    <circle cx="0" cy="0" r="10" fill="#1F2937" stroke="#EC4899" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="#EC4899" font-family="Arial">I</text>
    
    <circle cx="30" cy="0" r="10" fill="#1F2937" stroke="#9333EA" stroke-width="1"/>
    <text x="30" y="3" text-anchor="middle" font-size="10" fill="#9333EA" font-family="Arial">T</text>
    
    <!-- Connection Lines -->
    <line x1="-20" y1="0" x2="-10" y2="0" stroke="#9333EA" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="10" y1="0" x2="20" y2="0" stroke="#9333EA" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  
  <!-- Connection Lines between Major Elements -->
  <line x1="300" y1="200" x2="180" y2="130" stroke="#9333EA" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="440" y2="130" stroke="#9333EA" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="180" y2="260" stroke="#9333EA" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="440" y2="240" stroke="#9333EA" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="180" y2="330" stroke="#9333EA" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="420" y2="330" stroke="#9333EA" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Data Flow Animations on Lines -->
  <circle cx="0" cy="0" r="3" fill="#EC4899">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L180,130"/>
  </circle>
  <circle cx="0" cy="0" r="3" fill="#EC4899">
    <animateMotion dur="4s" repeatCount="indefinite" path="M300,200 L440,130"/>
  </circle>
  <circle cx="0" cy="0" r="3" fill="#EC4899">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M300,200 L180,260"/>
  </circle>
  <circle cx="0" cy="0" r="3" fill="#EC4899">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M300,200 L440,240"/>
  </circle>
  <circle cx="0" cy="0" r="3" fill="#EC4899">
    <animateMotion dur="5s" repeatCount="indefinite" path="M300,200 L180,330"/>
  </circle>
  <circle cx="0" cy="0" r="3" fill="#EC4899">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M300,200 L420,330"/>
  </circle>
  
  <!-- Central Marketing Intelligence Hub -->
  <g transform="translate(300, 200)">
    <!-- Hub Visualization -->
    <circle cx="0" cy="0" r="30" fill="#1F2937" stroke="#9333EA" stroke-width="1.5"/>
    
    <!-- Central Icon -->
    <path d="M-10,-5 L10,-5 L0,-15 Z" fill="#EC4899" fill-opacity="0.8"/>
    <path d="M-10,5 L10,5 L0,15 Z" fill="#9333EA" fill-opacity="0.8"/>
    <rect x="-10" y="-5" width="20" height="10" fill="#1F2937" stroke="#9333EA" stroke-width="0.5"/>
    
    <!-- Orbital Rings -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#9333EA" stroke-width="0.5" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#9333EA" stroke-width="0.5" stroke-opacity="0.5" stroke-dasharray="2,3"/>
  </g>
  
  <!-- Pulse Circle Animation -->
  <circle cx="300" cy="200" r="85" fill="none" stroke="#9333EA" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="70;90;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Small Decorative Elements -->
  <circle cx="230" cy="170" r="2" fill="#9333EA"/>
  <circle cx="250" cy="180" r="2" fill="#9333EA"/>
  <circle cx="350" cy="170" r="2" fill="#9333EA"/>
  <circle cx="370" cy="180" r="2" fill="#9333EA"/>
  <circle cx="300" cy="150" r="2" fill="#9333EA"/>
  <circle cx="320" cy="260" r="2" fill="#9333EA"/>
  <circle cx="280" cy="250" r="2" fill="#9333EA"/>
</svg> 