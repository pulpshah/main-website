<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.6"/>
    </linearGradient>
    
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
    
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.7"/>
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#darkGradient)"/>
  <rect width="600" height="400" fill="url(#gridPattern)"/>
  
  <!-- Central Hub - AI Platform -->
  <circle cx="300" cy="200" r="70" fill="url(#glowGradient)" opacity="0.5"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="300" cy="200" r="50" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Code Repository / SDK -->
  <g transform="translate(170, 130)">
    <!-- Repository Frame -->
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Code Lines -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="-10" x2="20" y2="-10" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="10" x2="15" y2="10" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-30" y1="20" x2="25" y2="20" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    
    <!-- Code Brackets -->
    <path d="M-20 -25 L-25 -20 L-20 -15" fill="none" stroke="#06b6d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 -25 L25 -20 L20 -15" fill="none" stroke="#06b6d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- API Gateway -->
  <g transform="translate(430, 130)">
    <!-- API Frame -->
    <rect x="-45" y="-30" width="90" height="60" rx="4" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- API Endpoint Lines -->
    <line x1="-35" y1="-15" x2="35" y2="-15" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    <line x1="-35" y1="15" x2="35" y2="15" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.7"/>
    
    <!-- HTTP Methods -->
    <rect x="-35" y="-20" width="20" height="10" rx="2" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="0.5"/>
    <text x="-25" y="-13" text-anchor="middle" font-size="6" fill="#06b6d4" font-family="monospace">GET</text>
    
    <rect x="-35" y="-5" width="20" height="10" rx="2" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="-25" y="2" text-anchor="middle" font-size="6" fill="#3b82f6" font-family="monospace">POST</text>
    
    <rect x="-35" y="10" width="20" height="10" rx="2" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="0.5"/>
    <text x="-25" y="17" text-anchor="middle" font-size="6" fill="#06b6d4" font-family="monospace">PUT</text>
  </g>
  
  <!-- Data Processing Pipeline -->
  <g transform="translate(180, 280)">
    <!-- Pipeline Frame -->
    <rect x="-60" y="-30" width="120" height="60" rx="4" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Pipeline Stages -->
    <circle cx="-40" cy="0" r="15" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="0" r="15" fill="#1F2937" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="40" cy="0" r="15" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Connection Lines -->
    <line x1="-25" y1="0" x2="-15" y2="0" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,1"/>
    <line x1="15" y1="0" x2="25" y2="0" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,1"/>
    
    <!-- Data Flow Animation -->
    <circle cx="-20" cy="0" r="2" fill="#3b82f6">
      <animate attributeName="cx" values="-25;-15;-25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="0" r="2" fill="#3b82f6">
      <animate attributeName="cx" values="15;25;15" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Icons inside circles -->
    <text x="-40" y="3" text-anchor="middle" font-size="10" fill="#3b82f6" font-family="monospace">In</text>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="#06b6d4" font-family="monospace">AI</text>
    <text x="40" y="3" text-anchor="middle" font-size="10" fill="#3b82f6" font-family="monospace">Out</text>
  </g>
  
  <!-- Security Shield -->
  <g transform="translate(430, 280)">
    <!-- Shield Background -->
    <path d="M0,-30 L45,0 L0,30 L-45,0 Z" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Shield Design -->
    <path d="M0,-20 L30,0 L0,20 L-30,0 Z" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,2"/>
    
    <!-- Lock Icon -->
    <rect x="-10" y="-5" width="20" height="15" rx="2" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="-10" r="5" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    <path d="M-3,-10 A3,3 0 0,1 3,-10" fill="none" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Scanning Animation -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.5">
      <animate attributeName="y1" values="-20;20;-20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-20;20;-20" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- User Interface Elements -->
  <g transform="translate(300, 120)">
    <!-- UI Frame -->
    <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- UI Elements -->
    <rect x="-25" y="-15" width="50" height="8" rx="1" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="-25" y="-2" width="20" height="5" rx="1" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="0.5"/>
    <rect x="-25" y="8" width="50" height="5" rx="1" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="0.5"/>
  </g>
  
  <!-- Developer Tools -->
  <g transform="translate(300, 280)">
    <!-- Tools Frame -->
    <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Developer Tool Icons -->
    <circle cx="-15" cy="-5" r="8" fill="#1F2937" stroke="#06b6d4" stroke-width="1"/>
    <text x="-15" y="-2" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="monospace">D</text>
    
    <circle cx="15" cy="-5" r="8" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    <text x="15" y="-2" text-anchor="middle" font-size="8" fill="#3b82f6" font-family="monospace">T</text>
    
    <rect x="-25" y="10" width="50" height="5" rx="1" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="0.5"/>
  </g>
  
  <!-- Connection Lines between Major Elements -->
  <line x1="300" y1="200" x2="170" y2="130" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="430" y2="130" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="180" y2="280" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="430" y2="280" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="300" y2="120" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="300" y1="200" x2="300" y2="280" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Data Flow Animations on Lines -->
  <circle cx="0" cy="0" r="2" fill="#06b6d4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L170,130"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#06b6d4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L430,130"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#06b6d4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L180,280"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#06b6d4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L430,280"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#06b6d4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L300,120"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#06b6d4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300,200 L300,280"/>
  </circle>
  
  <!-- Central AI Engine -->
  <g transform="translate(300, 200)">
    <!-- Central Platform Icon -->
    <circle cx="0" cy="0" r="30" fill="#1F2937" stroke="#3b82f6" stroke-width="1.5"/>
    
    <!-- AI Brain Visualization -->
    <path d="M-15,-15 Q0,-25 15,-15 Q25,0 15,15 Q0,25 -15,15 Q-25,0 -15,-15" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.8"/>
    
    <!-- Neural Network Nodes -->
    <circle cx="-15" cy="-15" r="2" fill="#3b82f6"/>
    <circle cx="15" cy="-15" r="2" fill="#3b82f6"/>
    <circle cx="15" cy="15" r="2" fill="#3b82f6"/>
    <circle cx="-15" cy="15" r="2" fill="#3b82f6"/>
    <circle cx="0" cy="-8" r="2" fill="#06b6d4"/>
    <circle cx="8" cy="0" r="2" fill="#06b6d4"/>
    <circle cx="0" cy="8" r="2" fill="#06b6d4"/>
    <circle cx="-8" cy="0" r="2" fill="#06b6d4"/>
    
    <!-- Neural Network Connections -->
    <line x1="-15" y1="-15" x2="0" y2="-8" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="15" y1="-15" x2="0" y2="-8" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="-8" x2="8" y2="0" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="-8" x2="-8" y2="0" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="8" y1="0" x2="15" y2="15" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="8" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="-8" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="-8" y1="0" x2="-15" y2="15" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="8" x2="15" y2="15" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="8" x2="-15" y2="15" stroke="#3b82f6" stroke-width="0.5"/>
  </g>
  
  <!-- Pulse Circle Animation -->
  <circle cx="300" cy="200" r="70" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="70;90;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Code Bubbles -->
  <g transform="translate(240, 160)">
    <circle cx="0" cy="0" r="10" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#3b82f6" font-family="monospace">{"}"}</text>
  </g>
  
  <g transform="translate(355, 235)">
    <circle cx="0" cy="0" r="12" fill="#1F2937" stroke="#06b6d4" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="monospace">[&nbsp;]</text>
  </g>
  
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="8" fill="#1F2937" stroke="#3b82f6" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#3b82f6" font-family="monospace">&lt;&gt;</text>
  </g>
  
  <g transform="translate(360, 170)">
    <circle cx="0" cy="0" r="10" fill="#1F2937" stroke="#06b6d4" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="monospace">( )</text>
  </g>
  
  <!-- Small Decorative Elements -->
  <circle cx="220" cy="180" r="2" fill="#3b82f6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="220" r="2" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="150" r="2" fill="#06b6d4">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="230" r="2" fill="#06b6d4">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="230" r="2" fill="#3b82f6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Labels -->
  <g transform="translate(170, 100)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="Arial">SDK</text>
  </g>
  
  <g transform="translate(430, 100)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="Arial">API</text>
  </g>
  
  <g transform="translate(180, 320)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="Arial">Pipeline</text>
  </g>
  
  <g transform="translate(430, 320)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="Arial">Security</text>
  </g>
  
  <g transform="translate(300, 100)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="Arial">Interface</text>
  </g>
  
  <g transform="translate(300, 320)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#06b6d4" font-family="Arial">Tools</text>
  </g>
  
  <g transform="translate(300, 200)">
    <text x="0" y="-40" text-anchor="middle" font-size="10" fill="#3b82f6" font-family="Arial">Pulp AI Platform</text>
  </g>
</svg> 