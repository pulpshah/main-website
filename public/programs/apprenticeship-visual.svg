<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10B981" stroke-opacity="0.1" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="connectorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8A3FFC" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background pattern -->
  <rect width="600" height="400" fill="url(#grid)" opacity="0.3" />
  
  <!-- Central Hub - Pulp Logo/Symbol -->
  <circle cx="300" cy="200" r="50" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="2" />
  <text x="300" y="205" fill="white" font-size="18" font-weight="bold" text-anchor="middle">PULP</text>
  
  <!-- Orbiting Student Figures -->
  <!-- Student 1 - Political Science -->
  <g>
    <circle cx="170" cy="130" r="35" fill="#111827" stroke="#10B981" stroke-width="1.5" />
    <text x="170" y="125" fill="white" font-size="12" font-weight="bold" text-anchor="middle">POLITICAL</text>
    <text x="170" y="140" fill="white" font-size="12" font-weight="bold" text-anchor="middle">SCIENCE</text>
  </g>
  
  <!-- Student 2 - Design -->
  <g>
    <circle cx="430" cy="130" r="35" fill="#111827" stroke="#8A3FFC" stroke-width="1.5" />
    <text x="430" y="135" fill="white" font-size="12" font-weight="bold" text-anchor="middle">DESIGN</text>
  </g>
  
  <!-- Student 3 - Engineering -->
  <g>
    <circle cx="170" cy="270" r="35" fill="#111827" stroke="#FF66C4" stroke-width="1.5" />
    <text x="170" y="275" fill="white" font-size="12" font-weight="bold" text-anchor="middle">ENGINEERING</text>
  </g>
  
  <!-- Student 4 - Cognitive Science -->
  <g>
    <circle cx="430" cy="270" r="35" fill="#111827" stroke="#10B981" stroke-width="1.5" />
    <text x="430" y="265" fill="white" font-size="12" font-weight="bold" text-anchor="middle">COGNITIVE</text>
    <text x="430" y="280" fill="white" font-size="12" font-weight="bold" text-anchor="middle">SCIENCE</text>
  </g>
  
  <!-- Connectors to center -->
  <path d="M 195 145 L 265 175" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />
  <path d="M 405 145 L 335 175" stroke="#8A3FFC" stroke-width="2" stroke-dasharray="4 2" />
  <path d="M 195 255 L 265 220" stroke="#FF66C4" stroke-width="2" stroke-dasharray="4 2" />
  <path d="M 405 255 L 335 220" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- Skills & Growth nodes -->
  <g>
    <circle cx="240" cy="120" r="25" fill="#111827" stroke="url(#connectorGradient)" stroke-width="2" />
    <text x="240" y="125" fill="white" font-size="10" text-anchor="middle">STRATEGIC</text>
    <text x="240" y="138" fill="white" font-size="8" text-anchor="middle">THINKING</text>
  </g>
  
  <g>
    <circle cx="360" cy="120" r="25" fill="#111827" stroke="url(#connectorGradient)" stroke-width="2" />
    <text x="360" y="125" fill="white" font-size="10" text-anchor="middle">CREATIVE</text>
    <text x="360" y="138" fill="white" font-size="8" text-anchor="middle">PROBLEM SOLVING</text>
  </g>
  
  <g>
    <circle cx="240" cy="280" r="25" fill="#111827" stroke="url(#connectorGradient)" stroke-width="2" />
    <text x="240" y="285" fill="white" font-size="10" text-anchor="middle">TECHNICAL</text>
    <text x="240" y="298" fill="white" font-size="8" text-anchor="middle">FLUENCY</text>
  </g>
  
  <g>
    <circle cx="360" cy="280" r="25" fill="#111827" stroke="url(#connectorGradient)" stroke-width="2" />
    <text x="360" y="285" fill="white" font-size="10" text-anchor="middle">LEADERSHIP</text>
  </g>
  
  <!-- Project bubbles -->
  <g>
    <circle cx="300" cy="110" r="30" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" />
    <text x="300" y="115" fill="white" font-size="14" font-weight="bold" text-anchor="middle">REAL</text>
    <text x="300" y="130" fill="white" font-size="8" text-anchor="middle">WORLD PROJECTS</text>
  </g>
  
  <g>
    <circle cx="300" cy="290" r="30" fill="#8A3FFC" fill-opacity="0.1" stroke="#8A3FFC" stroke-width="1.5" />
    <text x="300" y="295" fill="white" font-size="14" font-weight="bold" text-anchor="middle">MENTORSHIP</text>
  </g>
  
  <!-- Dynamic connecting lines -->
  <path d="M 300 140 L 300 170" stroke="#10B981" stroke-width="2" />
  <path d="M 300 230 L 300 260" stroke="#8A3FFC" stroke-width="2" />
  
  <!-- Floating keywords for interdisciplinary approach -->
  <g filter="url(#glow)">
    <text x="110" y="80" fill="#10B981" font-size="12" font-weight="bold">INTERDISCIPLINARY</text>
  </g>
  
  <g filter="url(#glow)">
    <text x="490" y="80" fill="#8A3FFC" font-size="12" font-weight="bold">INTERGENERATIONAL</text>
  </g>
  
  <g filter="url(#glow)">
    <text x="110" y="320" fill="#FF66C4" font-size="12" font-weight="bold">INTENTIONAL</text>
  </g>
  
  <g filter="url(#glow)">
    <text x="490" y="320" fill="#10B981" font-size="12" font-weight="bold">COLLABORATIVE</text>
  </g>
  
  <!-- Animation for center pulse -->
  <circle cx="300" cy="200" r="45" fill="transparent" stroke="#10B981" stroke-width="1">
    <animate attributeName="r" values="45;55;45" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animations for orbital paths -->
  <g opacity="0.3">
    <ellipse cx="300" cy="200" rx="130" ry="70" fill="transparent" stroke="#10B981" stroke-width="1" transform="rotate(0 300 200)">
      <animateTransform attributeName="transform" type="rotate" from="0 300 200" to="360 300 200" dur="30s" repeatCount="indefinite" />
    </ellipse>
    
    <ellipse cx="300" cy="200" rx="130" ry="70" fill="transparent" stroke="#8A3FFC" stroke-width="1" transform="rotate(90 300 200)">
      <animateTransform attributeName="transform" type="rotate" from="90 300 200" to="450 300 200" dur="30s" repeatCount="indefinite" />
    </ellipse>
  </g>
  
  <!-- Small particles in orbit -->
  <circle cx="300" cy="100" r="3" fill="#10B981">
    <animateMotion path="M0,0 a100,40 0 1,0 1,0 z" dur="8s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="300" cy="100" r="2" fill="#8A3FFC">
    <animateMotion path="M0,0 a100,40 0 1,0 1,0 z" dur="12s" repeatCount="indefinite" begin="2s" />
  </circle>
  
  <circle cx="300" cy="100" r="2" fill="#FF66C4">
    <animateMotion path="M0,0 a100,40 0 1,0 1,0 z" dur="10s" repeatCount="indefinite" begin="4s" />
  </circle>
  
  <circle cx="200" cy="200" r="3" fill="#10B981">
    <animateMotion path="M0,0 a40,100 0 1,0 1,0 z" dur="10s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="200" cy="200" r="2" fill="#8A3FFC">
    <animateMotion path="M0,0 a40,100 0 1,0 1,0 z" dur="14s" repeatCount="indefinite" begin="1s" />
  </circle>
  
  <circle cx="200" cy="200" r="2" fill="#FF66C4">
    <animateMotion path="M0,0 a40,100 0 1,0 1,0 z" dur="12s" repeatCount="indefinite" begin="3s" />
  </circle>
</svg> 