<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#EF444422" />
      <stop offset="100%" stop-color="#00000000" />
    </radialGradient>
    <linearGradient id="knowledge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background elements -->
  <rect width="500" height="400" fill="#000000" />
  <rect width="500" height="400" fill="url(#bg-glow)" />
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <path d="M0 50 H500 M0 100 H500 M0 150 H500 M0 200 H500 M0 250 H500 M0 300 H500 M0 350 H500" stroke="#FFFFFF" stroke-width="0.5" />
    <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400" stroke="#FFFFFF" stroke-width="0.5" />
  </g>
  
  <!-- Central Brain/Knowledge Hub -->
  <g>
    <!-- Central circle -->
    <circle cx="250" cy="160" r="70" fill="#111111" stroke="url(#knowledge-gradient)" stroke-width="2" />
    
    <!-- Brain connections -->
    <path d="M250,100 C270,110 290,150 250,180 C210,150 230,110 250,100 Z" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.6" />
    <path d="M250,100 C220,120 210,160 250,190 C290,160 280,120 250,100 Z" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.6" />
    
    <text x="250" y="150" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="16" font-family="sans-serif" font-weight="bold">KNOWLEDGE</text>
    <text x="250" y="170" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="16" font-family="sans-serif" font-weight="bold">SYNTHESIS</text>
  </g>
  
  <!-- Knowledge nodes -->
  <g>
    <!-- Connecting nodes with the central hub -->
    <g transform="translate(120, 90)">
      <circle cx="0" cy="0" r="25" fill="#111111" stroke="#EF4444" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">DATA</text>
      <line x1="25" y1="10" x2="100" y2="60" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4,2" />
    </g>
    
    <g transform="translate(380, 90)">
      <circle cx="0" cy="0" r="25" fill="#111111" stroke="#EF4444" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">RESEARCH</text>
      <line x1="-25" y1="10" x2="-100" y2="60" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4,2" />
    </g>
    
    <g transform="translate(120, 280)">
      <circle cx="0" cy="0" r="25" fill="#111111" stroke="#EF4444" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">ANALYSIS</text>
      <line x1="25" y1="-10" x2="100" y2="-60" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4,2" />
    </g>
    
    <g transform="translate(380, 280)">
      <circle cx="0" cy="0" r="25" fill="#111111" stroke="#EF4444" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">INSIGHT</text>
      <line x1="-25" y1="-10" x2="-100" y2="-60" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4,2" />
    </g>
  </g>
  
  <!-- Secondary concept nodes -->
  <g>
    <g transform="translate(210, 40)">
      <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#111111" stroke="#EF4444" stroke-width="1" opacity="0.8" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">INTEGRATION</text>
    </g>
    
    <g transform="translate(290, 40)">
      <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#111111" stroke="#EF4444" stroke-width="1" opacity="0.8" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">CONNECTIONS</text>
    </g>
    
    <g transform="translate(210, 320)">
      <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#111111" stroke="#EF4444" stroke-width="1" opacity="0.8" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">PATTERNS</text>
    </g>
    
    <g transform="translate(290, 320)">
      <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#111111" stroke="#EF4444" stroke-width="1" opacity="0.8" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">STRATEGY</text>
    </g>
  </g>
  
  <!-- Connection lines between secondary nodes -->
  <g opacity="0.5">
    <path d="M210,55 C230,100 230,260 210,305" stroke="#EF4444" stroke-width="1" stroke-dasharray="5,3" fill="none" />
    <path d="M290,55 C270,100 270,260 290,305" stroke="#EF4444" stroke-width="1" stroke-dasharray="5,3" fill="none" />
  </g>
  
  <!-- Pulse effect around the central hub -->
  <g opacity="0.2">
    <circle cx="250" cy="160" r="90" fill="none" stroke="#EF4444" stroke-width="1">
      <animate attributeName="r" from="70" to="90" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="160" r="80" fill="none" stroke="#EF4444" stroke-width="1">
      <animate attributeName="r" from="70" to="80" dur="2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.2" to="0" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Knowledge integration concepts -->
  <g transform="translate(60, 170)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#111111" stroke="#EF4444" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#EF4444" font-size="8" font-family="sans-serif">SOURCE DATA</text>
  </g>
  
  <g transform="translate(440, 170)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#111111" stroke="#EF4444" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#EF4444" font-size="8" font-family="sans-serif">OUTCOMES</text>
  </g>
  
  <!-- Flow arrows -->
  <g>
    <path d="M90,170 L120,170" stroke="#EF4444" stroke-width="1" />
    <polygon points="120,170 115,165 115,175" fill="#EF4444" />
    
    <path d="M410,170 L380,170" stroke="#EF4444" stroke-width="1" />
    <polygon points="380,170 385,165 385,175" fill="#EF4444" />
  </g>
</svg> 