<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradients -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>


  <!-- Information Nodes - Left Side (Complex Information) -->
  <g opacity="0.8">
    <!-- Chaotic Data Nodes -->
    <circle cx="180" cy="160" r="12" fill="#F59E0B" opacity="0.5" />
    <circle cx="150" cy="220" r="8" fill="#F59E0B" opacity="0.6" />
    <circle cx="200" cy="250" r="10" fill="#F59E0B" opacity="0.4" />
    <circle cx="120" cy="280" r="7" fill="#F59E0B" opacity="0.7" />
    <circle cx="180" cy="320" r="9" fill="#F59E0B" opacity="0.5" />
    <circle cx="135" cy="370" r="11" fill="#F59E0B" opacity="0.6" />
    <circle cx="210" cy="400" r="8" fill="#F59E0B" opacity="0.4" />
    <circle cx="160" cy="450" r="10" fill="#F59E0B" opacity="0.7" />
    
    <!-- Document Shapes -->
    <rect x="120" cy="120" y="120" width="40" height="50" rx="4" fill="#333" stroke="#F59E0B" stroke-width="1" />
    <rect x="220" cy="180" y="180" width="40" height="50" rx="4" fill="#333" stroke="#F59E0B" stroke-width="1" />
    <rect x="90" cy="340" y="340" width="40" height="50" rx="4" fill="#333" stroke="#F59E0B" stroke-width="1" />
    <rect x="230" cy="350" y="350" width="40" height="50" rx="4" fill="#333" stroke="#F59E0B" stroke-width="1" />
  </g>

  <!-- Connection Lines - Random, Chaotic -->
  <g opacity="0.4">
    <path d="M120 150 L180 160" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M180 160 L150 220" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M150 220 L200 250" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M200 250 L120 280" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M120 280 L180 320" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M180 320 L135 370" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M135 370 L210 400" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M210 400 L160 450" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M120 150 L220 180" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M150 220 L90 340" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M180 320 L230 350" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" />
  </g>

  <!-- Central Processing Element -->
  <g>
    <!-- Knowledge Processing Portal -->
    <ellipse cx="400" cy="300" rx="70" ry="120" fill="none" stroke="url(#amberGradient)" stroke-width="3" filter="url(#glow)" />
    <ellipse cx="400" cy="300" rx="65" ry="115" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5" />
    <ellipse cx="400" cy="300" rx="60" ry="110" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3" />
    
    <!-- Data Flow Lines - Entering the processor -->
    <path d="M180 160 C 280 180, 300 220, 340 240" stroke="#F59E0B" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M150 220 C 240 240, 280 260, 330 280" stroke="#F59E0B" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite" />
    </path>
    <path d="M200 250 C 280 270, 290 310, 330 320" stroke="#F59E0B" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M120 280 C 200 300, 250 330, 340 360" stroke="#F59E0B" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Information Nodes - Right Side (Synthesized Knowledge) -->
  <g>
    <!-- Organized Data Elements -->
    <rect x="560" y="200" width="160" height="200" rx="8" fill="#222" stroke="#F59E0B" stroke-width="2" />
    
    <!-- Synthesized Content Structure -->
    <!-- Header Element -->
    <rect x="580" y="220" width="120" height="20" rx="4" fill="url(#amberGradient)" opacity="0.8" />
    
    <!-- Key Points -->
    <circle cx="590" cy="260" r="5" fill="#F59E0B" />
    <rect x="605" y="255" width="100" height="10" rx="2" fill="#444" />
    
    <circle cx="590" cy="290" r="5" fill="#F59E0B" />
    <rect x="605" y="285" width="90" height="10" rx="2" fill="#444" />
    
    <circle cx="590" cy="320" r="5" fill="#F59E0B" />
    <rect x="605" y="315" width="95" height="10" rx="2" fill="#444" />
    
    <!-- Preserved Nuance Indicators -->
    <rect x="580" y="345" width="30" height="15" rx="7.5" fill="url(#purpleGradient)" opacity="0.7" />
    <rect x="620" y="345" width="30" height="15" rx="7.5" fill="url(#purpleGradient)" opacity="0.7" />
    <rect x="660" y="345" width="30" height="15" rx="7.5" fill="url(#purpleGradient)" opacity="0.7" />
    
    <!-- Action Items Section -->
    <rect x="580" y="370" width="120" height="15" rx="3" fill="#F59E0B" opacity="0.3" />
    
    <!-- Data Flow Lines - Exiting the processor -->
    <path d="M470 240 C 500 240, 530 240, 560 240" stroke="#F59E0B" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M470 280 C 500 280, 530 280, 560 280" stroke="#F59E0B" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite" />
    </path>
    <path d="M470 320 C 500 320, 530 320, 560 320" stroke="#F59E0B" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M470 360 C 500 360, 530 360, 560 360" stroke="#F59E0B" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Processor Core Elements -->
  <g transform="translate(400, 300)">
    <!-- Internal processing elements -->
    <circle cx="0" cy="0" r="30" fill="#222" stroke="#F59E0B" stroke-width="1" />
    <circle cx="0" cy="0" r="20" fill="#333">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Knowledge Synthesis Core -->
    <path d="M-15 -15 L15 15 M-15 15 L15 -15" stroke="#F59E0B" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" />
    </path>
    <circle cx="0" cy="0" r="10" fill="url(#amberGradient)">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#FFF" opacity="0.3" />
  </g>

  <!-- Preserved Nuance Visual Elements - Flowing through system -->
  <g>
    <circle cx="340" cy="240" r="4" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="cx" values="340;400;460" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="240;260;240" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="330" cy="280" r="4" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="cx" values="330;400;470" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;290;280" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="330" cy="320" r="4" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="cx" values="330;400;470" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="320;310;320" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="360" r="4" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="cx" values="340;400;460" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="360;340;360" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Labels -->
  <g>
    <text x="160" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F59E0B">Complex Information</text>
    <text x="400" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F59E0B" text-anchor="middle">Knowledge Synthesis</text>
    <text x="320" y="480" font-family="Arial, sans-serif" font-size="14" fill="#8B5CF6">Preserving nuance and depth</text>
    
    <!-- Bottom connecting path showing nuance preservation -->
    <path d="M390 490 L410 490" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="2 2" />
    <circle cx="390" cy="490" r="3" fill="#8B5CF6" />
    <circle cx="410" cy="490" r="3" fill="#8B5CF6" />
  </g>
</svg> 