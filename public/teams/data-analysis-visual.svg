<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111" stop-opacity="0.95"/>
    </linearGradient>
    
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9"/>
    </linearGradient>
    
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <clipPath id="chartClip">
      <rect x="120" y="150" width="560" height="200" rx="4"/>
    </clipPath>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="600" fill="url(#bgGradient)" rx="12"/>
  
  <!-- Dashboard grid lines -->
  <g opacity="0.15">
    <line x1="50" y1="100" x2="750" y2="100" stroke="#F59E0B" stroke-width="1"/>
    <line x1="50" y1="150" x2="750" y2="150" stroke="#F59E0B" stroke-width="1"/>
    <line x1="50" y1="350" x2="750" y2="350" stroke="#F59E0B" stroke-width="1"/>
    <line x1="50" y1="400" x2="750" y2="400" stroke="#F59E0B" stroke-width="1"/>
    <line x1="50" y1="450" x2="750" y2="450" stroke="#F59E0B" stroke-width="1"/>
    <line x1="50" y1="500" x2="750" y2="500" stroke="#F59E0B" stroke-width="1"/>
    
    <line x1="120" y1="50" x2="120" y2="550" stroke="#F59E0B" stroke-width="1"/>
    <line x1="240" y1="50" x2="240" y2="550" stroke="#F59E0B" stroke-width="1"/>
    <line x1="360" y1="50" x2="360" y2="550" stroke="#F59E0B" stroke-width="1"/>
    <line x1="480" y1="50" x2="480" y2="550" stroke="#F59E0B" stroke-width="1"/>
    <line x1="600" y1="50" x2="600" y2="550" stroke="#F59E0B" stroke-width="1"/>
    <line x1="720" y1="50" x2="720" y2="550" stroke="#F59E0B" stroke-width="1"/>
  </g>
  
  <!-- Main content frame -->
  <rect x="80" y="60" width="640" height="480" rx="12" fill="rgba(30, 30, 30, 0.6)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Header section -->
  <rect x="100" y="80" width="600" height="50" rx="8" fill="rgba(20, 20, 20, 0.8)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="120" y="112" fill="#F59E0B" font-family="Arial" font-size="18" font-weight="bold">Pulp Analytics Platform</text>
  <circle cx="650" cy="105" r="8" fill="#F59E0B" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="670" y="110" fill="#AAA" font-family="Arial" font-size="12">LIVE</text>
  
  <!-- Chart area -->
  <rect x="120" y="150" width="560" height="200" rx="8" fill="rgba(20, 20, 20, 0.5)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Trend line -->
  <g clip-path="url(#chartClip)">
    <path d="M120,350 C180,340 220,280 260,290 C310,300 340,280 380,250 C420,220 460,240 500,200 C540,160 590,180 630,140 C670,100 680,120 700,90" 
          stroke="#F59E0B" 
          stroke-width="3" 
          fill="none" 
          filter="url(#glow)">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="3s" fill="freeze"/>
    </path>
    
    <!-- Area under trend line -->
    <path d="M120,350 C180,340 220,280 260,290 C310,300 340,280 380,250 C420,220 460,240 500,200 C540,160 590,180 630,140 C670,100 680,120 700,90 L700,350 L120,350 Z" 
          fill="url(#chartGradient)" 
          opacity="0.5">
      <animate attributeName="opacity" from="0" to="0.5" dur="3s" fill="freeze"/>
    </path>
    
    <!-- Data points -->
    <circle cx="260" cy="290" r="6" fill="#F59E0B">
      <animate attributeName="r" values="0;6;4" dur="3s" fill="freeze"/>
    </circle>
    <circle cx="380" cy="250" r="6" fill="#F59E0B">
      <animate attributeName="r" values="0;6;4" dur="3s" begin="0.4s" fill="freeze"/>
    </circle>
    <circle cx="500" cy="200" r="8" fill="#F59E0B" stroke="#fff" stroke-width="2">
      <animate attributeName="r" values="0;8;6" dur="3s" begin="0.8s" fill="freeze"/>
    </circle>
    <circle cx="630" cy="140" r="6" fill="#F59E0B">
      <animate attributeName="r" values="0;6;4" dur="3s" begin="1.2s" fill="freeze"/>
    </circle>
  </g>
  
  <!-- Chart labels -->
  <text x="120" y="370" fill="#AAA" font-family="Arial" font-size="10">Q1</text>
  <text x="260" y="370" fill="#AAA" font-family="Arial" font-size="10">Q2</text>
  <text x="380" y="370" fill="#AAA" font-family="Arial" font-size="10">Q3</text>
  <text x="500" y="370" fill="#AAA" font-family="Arial" font-size="10">Q4</text>
  <text x="630" y="370" fill="#AAA" font-family="Arial" font-size="10">Q1</text>
  
  <!-- Metrics panels -->
  <g>
    <!-- Engagement panel -->
    <rect x="120" y="400" width="160" height="80" rx="8" fill="rgba(20, 20, 20, 0.7)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
    <text x="140" y="425" fill="#AAA" font-family="Arial" font-size="12">Total Engagement</text>
    <text x="140" y="455" fill="#FFF" font-family="Arial" font-size="24" font-weight="bold">248.7K</text>
    <text x="225" y="455" fill="#4ADE80" font-family="Arial" font-size="14">+7.3%</text>
    
    <!-- Conversion panel -->
    <rect x="320" y="400" width="160" height="80" rx="8" fill="rgba(20, 20, 20, 0.7)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
    <text x="340" y="425" fill="#AAA" font-family="Arial" font-size="12">Conversion Rate</text>
    <text x="340" y="455" fill="#FFF" font-family="Arial" font-size="24" font-weight="bold">3.2%</text>
    <text x="400" y="455" fill="#4ADE80" font-family="Arial" font-size="14">+0.8%</text>
    
    <!-- Sentiment panel -->
    <rect x="520" y="400" width="160" height="80" rx="8" fill="rgba(249, 115, 22, 0.2)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.8"/>
    <text x="540" y="425" fill="#AAA" font-family="Arial" font-size="12">Sentiment Score</text>
    <text x="540" y="455" fill="#FFF" font-family="Arial" font-size="24" font-weight="bold">76%</text>
    <text x="600" y="455" fill="#4ADE80" font-family="Arial" font-size="14">+5.2%</text>
  </g>
  
  <!-- Intent analysis circles -->
  <g>
    <circle cx="180" cy="525" r="15" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="85,100" stroke-dashoffset="-40">
      <animate attributeName="stroke-dashoffset" from="85" to="-40" dur="2s" fill="freeze"/>
    </circle>
    <text x="175" y="530" fill="#FFF" font-family="Arial" font-size="10" text-anchor="middle">82%</text>
    
    <circle cx="260" cy="525" r="15" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="65,100" stroke-dashoffset="-40">
      <animate attributeName="stroke-dashoffset" from="65" to="-40" dur="2s" fill="freeze"/>
    </circle>
    <text x="255" y="530" fill="#FFF" font-family="Arial" font-size="10" text-anchor="middle">65%</text>
    
    <circle cx="340" cy="525" r="15" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="78,100" stroke-dashoffset="-40">
      <animate attributeName="stroke-dashoffset" from="78" to="-40" dur="2s" fill="freeze"/>
    </circle>
    <text x="335" y="530" fill="#FFF" font-family="Arial" font-size="10" text-anchor="middle">78%</text>
  </g>
  
  <!-- Platform distribution bars -->
  <g>
    <rect x="400" y="510" width="80" height="10" rx="2" fill="#333"/>
    <rect x="400" y="510" width="70" height="10" rx="2" fill="#F59E0B">
      <animate attributeName="width" from="0" to="70" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="490" y="518" fill="#FFF" font-family="Arial" font-size="10">Instagram</text>
    
    <rect x="400" y="525" width="80" height="10" rx="2" fill="#333"/>
    <rect x="400" y="525" width="64" height="10" rx="2" fill="#F59E0B">
      <animate attributeName="width" from="0" to="64" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="490" y="533" fill="#FFF" font-family="Arial" font-size="10">LinkedIn</text>
    
    <rect x="400" y="540" width="80" height="10" rx="2" fill="#333"/>
    <rect x="400" y="540" width="48" height="10" rx="2" fill="#F59E0B">
      <animate attributeName="width" from="0" to="48" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="490" y="548" fill="#FFF" font-family="Arial" font-size="10">Twitter</text>
  </g>
  
  <!-- Insight indicators -->
  <g>
    <circle cx="600" cy="515" r="6" fill="#F59E0B">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="615" y1="515" x2="680" y2="515" stroke="#F59E0B" stroke-width="1.5"/>
    
    <circle cx="600" cy="535" r="6" fill="#F59E0B">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <line x1="615" y1="535" x2="680" y2="535" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
  
  <!-- Connection lines representing data flow -->
  <g opacity="0.4">
    <path d="M180,455 C180,480 180,500 180,525" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M340,455 C340,480 340,500 340,525" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M520,455 C520,480 520,500 600,515" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M570,455 C570,480 570,500 600,535" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>
  
  <!-- Data nodes symbolizing the data processing -->
  <g>
    <circle cx="260" cy="290" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="290;350;290" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="250" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="250;350;250" dur="4s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="500" cy="200" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="200;350;200" dur="4s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <circle cx="630" cy="140" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="140;350;140" dur="4s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="100" fill="url(#amberGradient)" filter="url(#glow)"/>
    <circle cx="750" cy="550" r="120" fill="url(#amberGradient)" filter="url(#glow)"/>
  </g>
</svg> 